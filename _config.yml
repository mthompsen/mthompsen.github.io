# Site settings — used by the minima theme and jekyll-seo-tag.
title: Mason Thompsen
description: Notes on security engineering and software projects.
author: Mason Thompsen
url: "https://mthompsen.github.io"
baseurl: ""

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Show post excerpts on the home page list.
show_excerpts: true

# Posts live under /blog/: /blog/2026/06/10/post-title.html
# (the portfolio page is the site root, index.html).
permalink: /blog/:year/:month/:day/:title:output_ext

# Portfolio files are served as-is; keep build-only files out of the site.
exclude:
  - README.md
  - tools/
  - Gemfile
  - Gemfile.lock
